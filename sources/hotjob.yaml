# hotjob（大易云）招聘门户。一行一个租户；侦察与接口说明见 docs/recon/hotjob.md。
# 2026-10-27 起社招也开：`work/hotjob_audit.py` 实测 80 个租户里社招岗普遍是校招的
# 3~5 倍（一汽 校招 511/社招 1113、长城 517/2644、中联重科 16/460），此前只抓校招
# 等于把大半个门户丢掉。详情请求量 = 岗位数，`max_pages: 0` 表示「按 positonNum 算够」。
defaults:
  adapter: hotjob
  recruit_types: [campus, social]
  rate_limit_rps: 1
  params:
    page_size: 50
  compliance:
    checked_on: 2026-10-22
    robots: allowed            # 抽查 wecruit/goertek/yili：User-agent: * / Allow: /
    terms: "大易云招聘门户的公开 JSON 接口（官网前端使用），无需登录、无签名、无验证码"
    notes: "侦察：docs/recon/hotjob.md。列表 + 每岗 1 次详情取 JD，1 req/s。"

