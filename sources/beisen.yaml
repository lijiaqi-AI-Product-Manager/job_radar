# 北森新版门户租户（{tenant}.zhiye.com）。一行一家；租户由 tenant-verify 工作流验证为 new 门户后加入。
# 第 1 批 67 家、第 2 批 36 家、第 3 批 28 家、第 4 批 21 家（2026-10-20 验证；旧版门户另见 docs/recon/beisen.md）。公司名为常用简称。
# 侦察与合规：docs/recon/beisen.md
defaults:
  adapter: beisen
  recruit_types: [campus, intern, social]
  rate_limit_rps: 1
  compliance:
    checked_on: 2026-10-20
    robots: allowed            # 各租户 robots.txt 均为 "User-agent: * / Allow: /"（抽查 beisen、fosunpharma、intsig、cfmoto）
    terms: "公开招聘门户，列表接口无需登录、无签名、明文 JSON"
    notes: "同一域名后缀下所有租户串行抓取（crawl 按适配器分组）"
