# Workday 租户（外资公司在华招聘常用）。侦察：docs/recon/workday.md
# 站点是全球站，只收 country 分面下的岗位（默认 China），避免把全球岗位灌进中国数据集。
defaults:
  adapter: workday
  recruit_types: [social, intern]   # 标题里明写 Intern 的岗位按 intern 入库
  rate_limit_rps: 1
  params:
    country: China
  compliance:
    checked_on: 2026-10-22
    robots: allowed            # nvidia.wd5.myworkdayjobs.com/robots.txt: Allow: /NVIDIAExternalCareerSite/，未禁止 /wday
    terms: "Workday 公开职位接口（官网前端使用），无需登录、无签名、无验证码；只取中国分面岗位"
    notes: "侦察：docs/recon/workday.md。中国岗位列表 + 每岗 1 次详情取 JD，1 req/s。"

sources:
  - id: nvidia
    company: 英伟达
    params:
      host: nvidia.wd5.myworkdayjobs.com
      tenant: nvidia
      site: NVIDIAExternalCareerSite

  - id: workday-intel
    company: 英特尔
    params:
      host: intel.wd1.myworkdayjobs.com
      tenant: intel
      site: External
      country: PRC          # Intel 的 location 分面用 "PRC, Shanghai" 这种写法
      max_pages: 3
      # 2026-10-27 实测：这个站点的 facets 里**没有地区维度**（只有 jobFamilyGroup /
      # workerSubType / timeType / locationMainGroup=「Locations」占位），
      # 所以国家分面永远找不到 → 整源报「找不到 location 分面」直接 0 岗。
      # 退回 searchText 检索：`searchText="China"` 返回 34 条、`"PRC"` 32 条，
      # 结果 locationsText 就是「PRC, Shanghai」这种明写地点，本地再校验一次国家即可。
      search_text: China

  - id: workday-pfizer
    company: 辉瑞
    params:
      host: pfizer.wd1.myworkdayjobs.com
      tenant: pfizer
      site: PfizerCareers
      location_facet: Location_Country   # 辉瑞用国家分面（descriptor 就是 "China"）
      country_exact: true
      max_pages: 12

  - id: workday-astrazeneca
    company: 阿斯利康
    params:
      host: astrazeneca.wd3.myworkdayjobs.com
      tenant: astrazeneca
      site: Careers
      country: China
      max_pages: 12

  # 2026-10-26 新增：从 careers.dupont.com/cn/zh 的岗位链接里读出真实 CXS 租户（站点名就是 Jobs）。
  # 中国岗位没有国家分面可选（facets 只有 jobFamilyGroup/workerSubType/timeType/locationMainGroup），
  # 所以用 searchText="China" 兜住；Workday 的 searchText 会命中标题/地点/描述，需人工复核比例。
  - id: workday-dupont
    company: 杜邦
    params:
      host: dupont.wd5.myworkdayjobs.com
      tenant: dupont
      site: Jobs
      country: China
      search_text: China    # 无国家分面时的兜底：按关键词检索
      max_pages: 3

  # 2026-10-26 批量探测新增（34 个候选租户里 13 个 CXS 可读，其中 5 个有 China 国家分面）。
  # 探测记录：docs/internal/SOURCE-DISCOVERY.md §4.2
