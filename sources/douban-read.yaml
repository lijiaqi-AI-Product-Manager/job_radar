id: douban-read
company: 豆瓣阅读
adapter: nextdata
recruit_types: [social]
rate_limit_rps: 1
params:
  base_url: "https://careers.arkread.com/"
  # 岗位数组在 Next.js 的服务端 props 里；职责/要求按 content[].name 的中文名归组
  jobs_path: props.pageProps.jobList
compliance:
  checked_on: 2026-10-27
  robots: allowed
  terms: "公开求职页（服务端渲染 HTML，岗位在 __NEXT_DATA__ 里），无需登录、无接口签名"
  notes: "2026-10-27 work/site_ats.py 官网反查命中；实测 24 岗，职责/要求 24/24 齐全"
