# Tupu360 招聘站（站点平台名 careersite.tupu360.com）。服务端渲染 HTML，无登录无签名。
# 侦察：docs/recon/tupu360.md。分页是 POST /{tenant}/position/nextPageList + offset/max，
# **不是** ?page=N（2026-10-26 实测 &page=2 与第1页 pid 完全相同）。
defaults:
  adapter: tupu360
  recruit_types: [campus, intern]
  rate_limit_rps: 1
  compliance:
    checked_on: 2026-10-26
    robots: not_applicable   # jobs.siemens.com.cn/robots.txt 返回 404（nginx 默认页，无 robots 规则）
    terms: "列表页与 nextPageList 均为官网对匿名访客直出的服务端渲染 HTML，无登录、无签名、无验证码；未使用 Cookie、未逆向任何加密参数。用户协议待人工复核"
    notes: "每类招聘 1 次 GET index + ceil(N/15) 次 POST nextPageList，西门子合计约 6 次/天，1 req/s。"

sources:
  - id: tupu360-siemens
    company: 西门子
    params:
      base: https://jobs.siemens.com.cn
      tenant: siemens
      fetch_detail: true          # 列表卡片没有正文，不开就是 0% JD 覆盖
      # 供 scripts/record_fixtures.py --keep-details 判定「哪些请求是详情页」，别自己删错
      url_filter: '/position/detail\?'

  # ---- 2026-10-27 平台首页批量扫描（work/tupu_scan.py + work/tupu_names.py）----
  # 租户清单**不是猜的**：`GET https://careersite.tupu360.com` 首页直出 293 个 `/<tenant>` 链接，
  # 逐个问 `positionTotal` 拿校招/社招岗位数，再用门户 `<meta name="description">` 取公司名。
  # 门户 `<title>` 一律是「职位列表」，slug 大量是数字/拼音缩写（`iscas`/`grgtest`/`wanji`），
  # **只能靠这个 meta 判归属**，不能拿 slug 猜公司。
  # 只收 ≥8 岗且 meta 明确写出公司全名的租户；`tupuats`/`tupuCampus`/`jobs`/`tupu1592`
  # 这类「图谱演示环境」「Tupujobs」是 ATS 自家的样板站，一律不收。
