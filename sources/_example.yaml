# 平台型来源的写法：defaults 写一次，每家公司一行。真实文件如 sources/moka.yaml（不要以 _ 开头）。
# compliance 必须由人实际核查后填写：robots.txt、服务条款、频率。见 COMPLIANCE.md。
defaults:
  adapter: moka
  recruit_types: [campus]
  rate_limit_rps: 1
  compliance:
    checked_on: 2026-10-20
    robots: allowed            # allowed / not_applicable（纯公开 JSON 接口且 robots 未覆盖）/ 其他需在 notes 说明
    terms: "无禁止自动化访问条款"
    notes: ""
sources:
  - {id: moka-demo-a, company: 示例公司A, params: {org: demo-a}}
  - {id: moka-demo-b, company: 示例公司B, params: {org: demo-b}}
