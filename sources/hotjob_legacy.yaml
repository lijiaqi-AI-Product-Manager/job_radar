# hotjob（大易云）老版 wt 门户。一行一个租户；侦察见 docs/recon/hotjob-legacy.md。
# 老版只开需要的招聘类型：伊利是校招大户（41 页），易方达只有社招（15 页）。
defaults:
  adapter: hotjob_legacy
  rate_limit_rps: 1
  compliance:
    checked_on: 2026-10-23
    robots: allowed            # 抽查 yili.hotjob.cn / efunds.hotjob.cn：User-agent: * / Allow: /
    terms: "大易云老版 wt 门户的公开 JSON 接口（官网前端使用），无需登录、无签名、无验证码"
    notes: "列表自带 JD 正文（workContent/serviceCondition），不需要详情请求；1 req/s。"

sources:
  - id: hotjob-legacy-yili
    company: 伊利
    recruit_types: [campus]
    params: {host: yili.hotjob.cn, tenant: yili, max_pages: 5, page_size: 10}
  - id: hotjob-legacy-efunds
    company: 易方达基金
    recruit_types: [social]
    params: {host: efunds.hotjob.cn, tenant: efunds, max_pages: 5, page_size: 10}
  - id: hotjob-legacy-lining
    company: 李宁
    recruit_types: [campus]
    params: {host: www.hotjob.cn, tenant: lining, max_pages: 10, page_size: 10}
  - id: hotjob-legacy-haidilao
    company: 海底捞
    recruit_types: [campus]
    params: {host: www.hotjob.cn, tenant: haidilao, max_pages: 2, page_size: 10}
  - id: hotjob-legacy-sbc
    company: 上海宝冶
    recruit_types: [campus]
    params: {host: www.hotjob.cn, tenant: sbc, max_pages: 3, page_size: 10}
  - id: hotjob-legacy-qianxin
    company: 奇安信
    recruit_types: [social]
    params: {host: www.hotjob.cn, tenant: qianxin, max_pages: 7, page_size: 10}
