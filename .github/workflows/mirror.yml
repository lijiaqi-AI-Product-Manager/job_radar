name: mirror-gitee
# 国内下载镜像：daily-crawl 发布成功后，把 Release data-latest 的压缩包同步到 Gitee 发行版，并匿名下载验证。
# 与 daily 分开：GitHub Actions → Gitee 上行很慢（实测单连接约 11KB/s），不能占用每日采集的时间。
# 需要：仓库 secret GITEE_TOKEN；GITEE_REPO（variable 或 secret，默认 qgauss/job_radar）。
on:
  workflow_run:
    workflows: [daily-crawl, calendar-data-repair, reviewed-data-repair, verified-source-recovery]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: mirror-gitee
  # 完成正在传输的完整代；排队任务启动后读取当时最新清单，避免频繁发布饿死慢上传。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.repository.outputs.ready }}
      state: ${{ steps.repository.outputs.state }}
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ vars.GITEE_REPO || secrets.GITEE_REPO || 'qgauss/job_radar' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check public Gitee repository
        id: repository
        run: uv run python scripts/check_gitee_readiness.py

  mirror:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_UPLOAD_WORKERS: "16"
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ vars.GITEE_REPO || secrets.GITEE_REPO || 'qgauss/job_radar' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download release assets
        run: |
          mkdir -p d
          # 同一清单下载完整文件集；暂存、匿名校验后才切换镜像稳定入口。
          uv run python scripts/download_snapshots.py --out d --compressed
          gh release download data-latest -D d -p 'crawl-summary.json'
          for name in jobs.db.gz jd_text.db.gz calendar.db.gz crawl-summary.json; do
            test -s "d/$name" || exit 1
          done
          ls -l d
      - name: Publish to Gitee
        run: uv run python -u scripts/publish_gitee.py d/jobs.db.gz d/jd_text.db.gz d/calendar.db.gz d/crawl-summary.json
      - name: Anonymous download check（逐片与整文件 SHA-256）
        run: uv run python -u scripts/verify_gitee.py d/jobs.db.gz d/jd_text.db.gz d/calendar.db.gz d/crawl-summary.json
