name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows 单独跑一遍：目标用户大多是 Windows，而"文件还开着就改名/删除"
    # 这类问题只在 Windows 上出现（POSIX 允许，ubuntu 一直是绿的）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      # 文档自检：断链 / 版本号 / `pip install jobradar` 说法（2026-10-24 实测发现三处不一致）
      - run: uv run python scripts/check_docs_links.py
      - run: uv run pytest
      # 打包体积守卫：2026-10-22 曾把 .uv-cache 打进 sdist，产物 117MB（发布阻断）
      - name: Build sdist/wheel and check size
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          size=$(stat -c%s dist/*.tar.gz)
          echo "sdist: $size bytes"
          if [ "$size" -gt 5242880 ]; then
            echo "::error::sdist 超过 5MB，检查是否有缓存/数据库被打包"
            exit 1
          fi
      # wheel 里必须带简称映射表，否则 pip 装完 `--company 中核` 查不到（源码树里测不出来）
      - name: Wheel must contain company_aliases.yaml
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          target = "jobradar/_data/company_aliases.yaml"
          print(wheel, "->", target in names)
          sys.exit(0 if target in names else 1)
          PY

  py311:
    # 兼容性下限：pyproject 声明 >=3.11，这里真跑一遍（只跑 ubuntu，省额度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: uv run pytest
