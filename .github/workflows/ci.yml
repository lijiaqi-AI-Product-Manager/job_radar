name: ci
on:
  push:
  pull_request:

jobs:
  test:
    # Windows 单独跑一遍：目标用户大多是 Windows，而"文件还开着就改名/删除"
    # 这类问题只在 Windows 上出现（POSIX 允许，ubuntu 一直是绿的）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest
      # 打包体积守卫：2026-10-22 曾把 .uv-cache 打进 sdist，产物 117MB（发布阻断）
      - name: Build sdist/wheel and check size
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          size=$(stat -c%s dist/*.tar.gz)
          echo "sdist: $size bytes"
          if [ "$size" -gt 5242880 ]; then
            echo "::error::sdist 超过 5MB，检查是否有缓存/数据库被打包"
            exit 1
          fi
