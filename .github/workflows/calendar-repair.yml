name: calendar-data-repair
# 对已发布日历执行已审核的定点修正，不触发完整采集或包发布。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - name: Download published calendar
        run: |
          mkdir -p original repaired
          gh release download data-latest -D original -p calendar.db
          cp original/calendar.db repaired/calendar.db
      - name: Preserve original snapshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: calendar-before-correction
          path: original/calendar.db
          retention-days: 14
      - name: Apply reviewed corrections
        run: |
          uv run python scripts/apply_calendar_corrections.py --db repaired/calendar.db --apply
          gzip -9 -k repaired/calendar.db
      - name: Publish corrected calendar
        run: gh release upload data-latest repaired/calendar.db repaired/calendar.db.gz --clobber
