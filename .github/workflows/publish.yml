name: publish-pypi
# 发布到 PyPI：推送 v* 标签时自动跑，也可手动（可选 TestPyPI 预演）。
# 需要先在 PyPI 配好 Trusted Publishing（见 docs/PUBLISHING.md），不需要存 API token。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "发布到哪里"
        type: choice
        options: ["pypi", "testpypi", "none"]
        default: "none"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run python scripts/check_docs_links.py
      - run: uv run python scripts/check_compliance.py
      - run: uv run pytest
      - name: Build sdist + wheel
        run: |
          rm -rf dist
          uv build
          ls -l dist
          uv run python - <<'PY'
          import glob, sys
          size = max(__import__("os").path.getsize(p) for p in glob.glob("dist/*"))
          print(f"max artifact: {size} bytes")
          if size > 5 * 1024 * 1024:
              sys.exit("artifact 超过 5MB，检查是否把缓存/数据库打进去了")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Package standalone skill
        run: uv run python scripts/package_skill.py --output .tmp/skill/jobradar-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jobradar-skill
          path: .tmp/skill/jobradar-skill.zip
      - name: Verify installed release wheel
        run: |
          py=$(uv run python -c 'import sys;print(sys.executable)')
          uv pip install --python "$py" --reinstall --no-deps dist/*.whl
          "$py" scripts/check_installed_cli.py --python "$py"

  publish-testpypi:
    # 仓库变量 PYPI_ENABLED=true 才会真的发（未配置 Trusted Publishing 前不会红）
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && vars.PYPI_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: vars.PYPI_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
