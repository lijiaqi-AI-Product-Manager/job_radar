name: daily-crawl
# 每日抓取 -> 增量写入上一次发布的库 -> 发布到 Release data-latest；每周一另存一份快照到 data-archive。
# 注意：schedule 只在默认分支生效。
on:
  schedule:
    - cron: "17 19 * * *"   # UTC 19:17 = 北京时间 03:17
  workflow_dispatch:
    inputs:
      budget_seconds:
        type: number
        default: 14400
        description: 整轮采集预算（秒）
      stale_only_hours:
        type: number
        default: 0
        description: 只补超过指定小时未成功的源，0为全部
      source_budget_seconds:
        type: number
        default: 3600
        description: 单源完整读取预算（秒），默认3600秒；整轮仍受总预算约束
      only_sources:
        type: string
        default: ""
        description: 定向复验的源ID，逗号分隔；留空按原计划采集全部源
      detail_progress_asset_id:
        type: string
        default: ""
        description: 本仓库的规范化详情进度附件ID，仅用于明确指定来源的复验
      detail_progress_sha256:
        type: string
        default: ""
        description: 详情进度附件SHA-256，与附件ID成对填写
      recovery_only:
        type: boolean
        default: false
        description: 仅补采最近观测中的预算未完成与瞬时故障，不重跑整轮
      recovery_budget_seconds:
        type: number
        default: 1800
        description: 自动补采预算（秒，最多3600）；原单源预算不重置

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 四小时采集预算之外，预留迁移、入库、日历构建、质量门禁与上传时间。
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen

      - name: Validate recovery selection
        env:
          RECOVERY_ONLY: ${{ inputs.recovery_only }}
          ONLY_SOURCES: ${{ inputs.only_sources }}
          STALE_HOURS: ${{ inputs.stale_only_hours || 0 }}
        run: |
          if [ "$RECOVERY_ONLY" = "true" ] && { [ -n "$ONLY_SOURCES" ] || [ "$STALE_HOURS" != "0" ]; }; then
            echo "recovery_only requires full source context; leave only_sources and stale_only_hours empty"
            exit 1
          fi

      - name: Restore previous databases
        # 历史是核心资产：Release 存在但下载失败时必须失败退出，绝不能"从零开始"后覆盖历史
        run: |
          mkdir -p data
          if gh release view data-latest >/dev/null 2>&1; then
            uv run python scripts/download_snapshots.py --out data
            python3 -c "import sqlite3; c=sqlite3.connect('data/jobs.db'); assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'; print('restored jobs:', c.execute('SELECT COUNT(*) FROM job').fetchone()[0])"
          else
            echo "no data-latest release yet, starting fresh"
          fi
          python3 -c "import sqlite3,os; p='data/jobs.db'; print(sqlite3.connect(p).execute('SELECT COUNT(*) FROM job').fetchone()[0] if os.path.exists(p) else 0)" > restored_count.txt

      - name: Preserve snapshots before manual recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshots-before-recovery
          path: data/*.db
          compression-level: 9
          retention-days: 14

      - name: Restore detail progress
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: data/detail-cache
          key: details-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: details-v1-

      - name: Import verified detail progress
        if: github.event_name == 'workflow_dispatch' && (inputs.detail_progress_asset_id != '' || inputs.detail_progress_sha256 != '')
        env:
          PROGRESS_ASSET_ID: ${{ inputs.detail_progress_asset_id }}
          PROGRESS_SHA256: ${{ inputs.detail_progress_sha256 }}
          ONLY_SOURCES: ${{ inputs.only_sources }}
          RECOVERY_ONLY: ${{ inputs.recovery_only }}
          STALE_HOURS: ${{ inputs.stale_only_hours || 0 }}
        run: |
          [[ "$PROGRESS_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$PROGRESS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$ONLY_SOURCES" && test "$RECOVERY_ONLY" != "true" && test "$STALE_HOURS" = "0"
          size=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$PROGRESS_ASSET_ID" --jq '.size')
          test "$size" -gt 0 && test "$size" -le 52428800
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$PROGRESS_ASSET_ID" -H 'Accept: application/octet-stream' > detail-progress.json.gz
          uv run python scripts/detail_progress.py import --cache-root data/detail-cache --payload detail-progress.json.gz --sha256 "$PROGRESS_SHA256" --only "$ONLY_SOURCES"

      - name: Crawl
        if: inputs.recovery_only != true
        shell: bash   # 启用 pipefail：全部源失败时 tee 不会吞掉退出码
        env:
          CRAWL_ONLY_SOURCES: ${{ inputs.only_sources }}
          CRAWL_SOURCE_BUDGET_SECONDS: ${{ inputs.source_budget_seconds || 3600 }}
        run: |
          selection=()
          if [ -n "$CRAWL_ONLY_SOURCES" ]; then selection=(--only "$CRAWL_ONLY_SOURCES"); fi
          uv run jobradar crawl --sources sources --out data --budget-seconds "${{ inputs.budget_seconds || 14400 }}" --source-budget "$CRAWL_SOURCE_BUDGET_SECONDS" --workers 24 --stale-only-hours "${{ inputs.stale_only_hours || 0 }}" "${selection[@]}" | tee crawl-summary.json

      - name: Recover deferred sources
        if: inputs.only_sources == '' && (inputs.stale_only_hours == 0 || inputs.stale_only_hours == '')
        env:
          RECOVERY_ONLY: ${{ inputs.recovery_only }}
          RECOVERY_BUDGET: ${{ inputs.recovery_budget_seconds || 1800 }}
          SOURCE_BUDGET: ${{ inputs.source_budget_seconds || 3600 }}
        run: |
          selection=()
          if [ "$RECOVERY_ONLY" = "true" ]; then selection=(--recovery-only); fi
          uv run python scripts/recover_sources.py --home data --sources sources --summary crawl-summary.json --budget-seconds "$RECOVERY_BUDGET" --source-budget "$SOURCE_BUDGET" "${selection[@]}"

      - name: Apply reviewed data corrections
        run: uv run python scripts/repair_reviewed_data.py --home data --apply

      - name: Normalize snapshot categories
        run: uv run python scripts/repair_categories.py --db data/jobs.db --apply --audit data/category-plan.json | tee category-report.json

      - name: Preserve category audit
        if: always() && hashFiles('data/category-plan.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: category-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/category-plan.json
            category-report.json
          retention-days: 90

      - name: Build recruiting calendar
        # 三库成套发布；日历构建与质量门禁失败均阻止切换。链接探活由独立任务完成。
        timeout-minutes: 30
        run: |
          uv run jobradar calendar-build --jobs data/jobs.db --out data/calendar.db
          uv run python - <<'PY'
          import sqlite3, sys, datetime
          ts = sqlite3.connect("data/calendar.db").execute("SELECT MAX(ts) FROM build").fetchone()[0]
          today = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%d")
          print(f"calendar build ts={ts} today={today}")
          if not str(ts).startswith(today):
              sys.exit(f"calendar.db 没有更新到今天（{ts}），发布里会继续是旧数据")
          PY

      - name: Publish data-latest
        id: publish_data
        shell: bash
        run: |
          python3 -c "import sqlite3; n=sqlite3.connect('data/jobs.db').execute('SELECT COUNT(*) FROM job').fetchone()[0]; old=int(open('restored_count.txt').read()); assert n >= old, 'job rows decreased; refusing to publish'"
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest data" --notes "Verified recruiting snapshots" --latest=false
          uv run python scripts/export_public_databases.py --home data --out data/public
          uv run python scripts/release_check.py --home data/public
          gzip -n -9 -k -f data/public/jobs.db data/public/jd_text.db data/public/calendar.db
          uv run python scripts/publish_snapshots.py --home data/public

      - name: Preserve unpublished snapshots
        if: failure() && steps.publish_data.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unpublished-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/jobs.db
            data/jd_text.db
            data/calendar.db
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

      - name: Publish health diagnostics
        if: inputs.only_sources == '' && (inputs.stale_only_hours == 0 || inputs.stale_only_hours == '')
        run: gh release upload data-latest crawl-summary.json recovery-report.json --clobber

      - name: Weekly archive snapshot
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            d=$(date -u +%Y-%m-%d)
            cp data/public/jobs.db "data/jobs-$d.db"
            uv run python scripts/weekly_report.py data/jobs.db --calendar data/calendar.db > "data/weekly-$d.md"
            gh release view data-archive >/dev/null 2>&1 || \
              gh release create data-archive --title "Weekly snapshots" --notes "每周主库快照与周报，用于灾备、历史回溯与传播。" --latest=false
            gh release upload data-archive "data/jobs-$d.db" "data/weekly-$d.md" --clobber
            # 保留策略：只留最近 8 周（每份 jobs.db ~85MB，无限增长会把 release 撑爆）
            cutoff=$(date -u -d '8 weeks ago' +%Y-%m-%d)
            gh api "repos/${{ github.repository }}/releases/tags/data-archive" --jq '.assets[].name' \
              | grep -E '^(jobs|weekly)-[0-9]{4}-[0-9]{2}-[0-9]{2}\.(db|md)$' | while read -r name; do
                  day=$(echo "$name" | sed -E 's/^[a-z]+-([0-9]{4}-[0-9]{2}-[0-9]{2})\..*$/\1/')
                  if [[ "$day" < "$cutoff" ]]; then
                    echo "prune $name (older than $cutoff)"
                    gh release delete-asset data-archive "$name" -y
                  fi
                done
          fi

      - name: Save detail progress
        if: always()
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: data/detail-cache
          key: details-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Health issue
        if: always() && inputs.only_sources == '' && (inputs.stale_only_hours == 0 || inputs.stale_only_hours == '')
        env:
          CRAWL_JOB_STATUS: ${{ job.status }}
        run: |
          bad=0
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          uv run python scripts/health_report.py crawl-summary.json --sources sources --context recovery-report.json --run-status "$CRAWL_JOB_STATUS" --run-url "$run_url" > report.md || bad=$?
          # 报告工具本身异常时仍提供运行入口，绝不把空正文写回现有 Issue。
          if [ ! -s report.md ]; then
            printf '采集健康报告生成失败，无法确认数据源已恢复。请查看[本次运行](%s)。\n' "$run_url" > report.md
            bad=1
          fi
          uv run python scripts/sync_health_issue.py --report report.md --bad "$bad"

      - name: Preserve crawl diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crawl-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crawl-summary.json
            initial-summary.json
            recovery-report.json
            category-report.json
            report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Keep schedule alive
        # 公开仓库 60 天无活动会自动停用定时任务；每月 1 日重新启用一次
        run: |
          if [ "$(date -u +%d)" = "01" ]; then gh workflow enable daily.yml; fi
