name: mirror-check
# 把 Release data-latest 的压缩包同步到 Gitee，并匿名下载验证（检验 GITEE_TOKEN 配置）。
on:
  push:
    paths:
      - docs/recon/mirror-check.txt
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ vars.GITEE_REPO || secrets.GITEE_REPO || 'qgauss/job_radar' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check configuration (values are not printed)
        run: |
          echo "GITEE_TOKEN set: $([ -n "$GITEE_TOKEN" ] && echo yes || echo NO)"
          echo "GITEE_REPO: $GITEE_REPO"
      - run: mkdir -p d && gh release download data-latest -D d -p 'jobs.db.gz' -p 'jd_text.db.gz' -p 'calendar.db.gz' || true; ls -l d
      - name: Connectivity to Gitee
        run: |
          curl -sS -o /dev/null -w "api repo: %{http_code} %{time_total}s\n" "https://gitee.com/api/v5/repos/$GITEE_REPO"
          head -c 1000000 /dev/urandom > /tmp/probe.bin
          curl -sS -o /dev/null -w "upload 1MB (to repo page, expect 4xx): %{http_code} %{speed_upload} B/s %{time_total}s\n" \
            --max-time 120 -F "file=@/tmp/probe.bin" "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/0/attach_files" || true
      - name: Publish to Gitee
        timeout-minutes: 40
        run: uv run python -u scripts/publish_gitee.py d/*.gz
      - name: Anonymous download test
        run: |
          for f in jobs.db.gz; do
            url="https://gitee.com/$GITEE_REPO/releases/download/data-latest/$f"
            curl -sSL -o /tmp/$f -w "%{http_code} %{size_download} bytes %{time_total}s\n" "$url"
            file /tmp/$f
          done
