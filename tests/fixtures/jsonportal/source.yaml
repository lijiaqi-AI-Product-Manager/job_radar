id: jsonportal-cec
company: 中国电子
adapter: jsonportal
params:
  base: https://campus.cec.com.cn/student-api/api/position/search
  method: POST
  page_param: page
  size_param: size
  page_size: 10
  max_pages: 2
  list_path: data.records
  total_path: data.total
  page_path: data.current
  pages_path: data.pages
  extra_body: {name: "", degree: null, orgId: []}
  detail_url: https://campus.cec.com.cn/position/{id}
  user_agent: jobradar/0.1
  type_param:
    positionType: {campus: '0'}
  fields:
    title: name
    city: cityName
    description: jobDescription
    requirement: jobRequirements
    deadline: closeDate
    org: org
    code: positionNo
    dept: positionSecondOrg
recruit_types:
- campus
enabled: true
rate_limit_rps: 1.0
compliance:
  checked_on: '2026-10-27'
  robots: allowed
  terms: 招聘门户前端使用的公开 JSON 接口，匿名可调，无登录、无签名、无验证码
  notes: 侦察见 docs/recon/jsonportal.md；每站 1 req/s
