[project]
name = "jobradar"
version = "1.1.0"
description = "每日自动更新的中国校招/实习/社招岗位开放数据集：CLI + MCP + Skill，让 AI agent 直接查询（零服务器、可离线）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["jobs", "campus-recruitment", "china", "dataset", "ai-agents", "mcp", "cli", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

# taxonomy/ 在仓库根，不在包里；但 `--company 中核` 的简称映射靠它。
# 不打进 wheel 的话 pip 用户拿不到映射（源码树里跑测试却是绿的）。
[tool.hatch.build.targets.wheel.force-include]
"taxonomy/company_aliases.yaml" = "jobradar/_data/company_aliases.yaml"

# sdist 白名单：只打包需要的东西。默认行为会把 .uv-cache/（几十 MB）一起塞进 tar，
# 2026-10-22 实测产物 117MB——这是发布阻断项。
[tool.hatch.build.targets.sdist]
include = [
  "src/jobradar", "tests", "sources", "taxonomy", "targets", "calendar",
  "scripts", "skill", "docs", "evals",
  "README.md", "CLAUDE.md", "COMPLIANCE.md", "LICENSE", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
jobradar = "jobradar.cli:main"
jobradar-mcp = "jobradar.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]

[project.urls]
Homepage = "https://github.com/lijiaqimun-coder/job_radar"
Repository = "https://github.com/lijiaqimun-coder/job_radar"
Changelog = "https://github.com/lijiaqimun-coder/job_radar/blob/main/CHANGELOG.md"
Issues = "https://github.com/lijiaqimun-coder/job_radar/issues"
