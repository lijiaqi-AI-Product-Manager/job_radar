[project]
name = "jobradar"
version = "0.1.0"
description = "Daily-updated, structured open dataset of Chinese campus/intern/social job postings, for AI agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
jobradar = "jobradar.cli:main"
jobradar-mcp = "jobradar.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]
