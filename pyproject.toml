[project]
name = "jobsearchradar"
dynamic = ["version"]
description = "给 AI 助手的求职搜索技能：用自然语言查询中国校招、实习、社招与招聘日历，支持 Skill 和 MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "job-search", "jobs", "campus-recruitment", "internship", "recruitment", "china",
    "dataset", "mcp", "mcp-server", "model-context-protocol", "cli", "sqlite",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jobradar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

# taxonomy/ 在仓库根，不在包里；但 `--company 中核` 的简称映射靠它。
# 不打进 wheel 的话 pip 用户拿不到映射（源码树里跑测试却是绿的）。
[tool.hatch.build.targets.wheel.force-include]
"taxonomy/company_aliases.yaml" = "jobradar/_data/company_aliases.yaml"
"taxonomy/categories.yaml" = "jobradar/_data/categories.yaml"

# sdist 白名单：只打包需要的东西。默认行为会把 .uv-cache/（几十 MB）一起塞进 tar，
# 2026-10-22 实测产物 117MB——这是发布阻断项。
[tool.hatch.build.targets.sdist]
# 首页宣传图片由完整HTTPS地址加载，独立于Python源码包分发。
exclude = ["/docs/assets/readme/**"]
include = [
  "src/jobradar", "tests", "sources", "taxonomy", "targets", "calendar",
  "scripts", "skill", "docs", "evals",
  "README*.md", "CHANGELOG.md", "AGENTS.md", "CONTRIBUTING.md", ".github", "uv.lock",
  "work/*.py", "docs/DEVELOPMENT.md", "COMPLIANCE.md", "LICENSE", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
jobradar = "jobradar.cli:main"
jobradar-mcp = "jobradar.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[project.urls]
Documentation = "https://github.com/lijiaqi-AI-Product-Manager/job_radar/blob/main/docs/README.md"
Homepage = "https://github.com/lijiaqi-AI-Product-Manager/job_radar"
Repository = "https://github.com/lijiaqi-AI-Product-Manager/job_radar"
Changelog = "https://github.com/lijiaqi-AI-Product-Manager/job_radar/blob/main/CHANGELOG.md"
Issues = "https://github.com/lijiaqi-AI-Product-Manager/job_radar/issues"
