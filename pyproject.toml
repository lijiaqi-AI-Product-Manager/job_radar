[project]
name = "jobradar"
version = "0.1.0"
description = "Daily-updated, structured open dataset of Chinese campus/intern/social job postings, for AI agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

# sdist 白名单：只打包需要的东西。默认行为会把 .uv-cache/（几十 MB）一起塞进 tar，
# 2026-10-22 实测产物 117MB——这是发布阻断项。
[tool.hatch.build.targets.sdist]
include = [
  "src/jobradar", "tests", "sources", "taxonomy", "targets", "calendar",
  "scripts", "skill", "docs", "evals",
  "README.md", "CLAUDE.md", "COMPLIANCE.md", "LICENSE", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[project.scripts]
jobradar = "jobradar.cli:main"
jobradar-mcp = "jobradar.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]
