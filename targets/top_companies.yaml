# 覆盖目标：中国校招/求职关注度最高的雇主（2026-10-26 扩到 1021 家，按行业分组）。
# 用于衡量覆盖率：scripts/coverage_report.py 把这里的公司与 sources/ 中的 company 对照。
# 名单是"值得覆盖"的目标，不代表都能合规覆盖；不能做的在 blocked 里写明原因与侦察文档。
# 欢迎 PR 增删（附理由）。
#
# 分组口径：
#   - 前 500 家是人工按行业整理的原始目标（2026-10-22）。
#   - 「扩展池（实测确认）」是 2026-10-25~26 实测打通入口后追加的公司，
#     多数已有行业标注；剩余未标注行业的留在这里，不等于"不重要"，只是行业待核。
#     判行业用 work/classify_sectors.py（公司名 -> 页面标题 -> 人工核对表），
#     规则判不出的**不硬塞**——错误行业比没有行业更糟，会让"按行业筛"筛出错结果。

