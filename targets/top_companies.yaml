blocked:
  大疆: 必然：不是 ATSX 而是 Moka，职位接口返回加密串 + necromancer（docs/recon/atsx.md）
  拼多多: 必然：前端完整验证码流程，robots 403（docs/recon/bigtech.md）
  华为: 必然：列表接口匿名返回 403（docs/recon/bigtech.md）
  快手: '政策禁止：robots.txt Disallow: /，不是技术问题（docs/recon/bigtech.md）'
  博世: '政策禁止：api.smartrecruiters.com 的 robots.txt 对非 LinkedInBot 一律 Disallow: /（docs/recon/smartrecruiters.md）'
  BOSS直聘: 政策禁止：招聘平台自身域名在 taxonomy/calendar.yaml 的 third_party_blocklist 里，按红线不能作为来源（2026-10-23）
  猎聘: 政策禁止：同上，平台自身域名属第三方站点黑名单（2026-10-23）
  智联招聘: 政策禁止：同上，平台自身域名属第三方站点黑名单（2026-10-23）
  前程无忧: 政策禁止：同上，平台自身域名属第三方站点黑名单（2026-10-23）
  微博: 必然：官网域名只暴露 Sina Visitor System 登录墙，招聘入口在登录后/第三方托管（2026-10-23 实测）
  招商蛇口: 未找到可用入口：cmsk.com 及子域已被域名商占用（DotPros marketplace），cmsk.zhiye.com 全部路径 404（2026-10-23）
  中国建筑: 必然：recruit.cscec.com 自研网关，请求/响应都用 hcm_param 加密（策略 ha/hb5），按铁律不逆向（docs/recon/cscec.md）
