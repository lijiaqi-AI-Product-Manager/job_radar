# 职类归一化规则：按岗位标题关键词匹配，自上而下，命中第一条即停止。
# 拿不准就不要加规则——宁可留空，也不要分错（标题仍可用 --keyword 检索）。
# 修改本文件不会产生"岗位变更"事件（职类不计入内容哈希），下一次抓取时静默生效。
# 关键词为正则（不区分大小写）。

rules:
  # —— 明确的非技术类先匹配，避免"产品经理（算法方向）"之类被误判；设计类放在芯片之后（"芯片设计师"）——
  - {category: 管培, subcategory: 管培生, any: ["管培生", "管理培训生", "培训生", "储备干部"]}
  - {category: 产品, subcategory: 产品经理, any: ["产品经理", "产品策划", "产品专员", "产品助理"]}
  - {category: 项目管理, subcategory: 项目管理, any: ["项目管理", "项目经理", "项目专员", "项目助理"]}

  # —— 技术类 ——
  - {category: 技术, subcategory: 算法, any: ["算法", "机器学习", "深度学习", "大模型", "LLM", "NLP", "自然语言", "计算机视觉", "机器视觉", "图像识别", "推荐系统", "语音识别", "多模态", "具身智能", "强化学习", "Agent", "AIGC"]}
  - {category: 技术, subcategory: 芯片/硬件, any: ["芯片", "数字IC", "模拟IC", "(?<![A-Za-z])IC(?![A-Za-z])", "集成电路", "版图", "FPGA", "SoC", "射频", "硬件工程师", "硬件开发", "硬件设计", "硬件研发", "电路设计", "PCB", "验证工程师", "DFT", "封装", "天线", "光学工程师", "光学设计", "器件开发", "机构设计", "阵列设计", "面板设计", "材料开发"]}
  - {category: 设计, subcategory: 设计, any: ["UI设计", "UX", "(?<![A-Za-z])UI(?![A-Za-z])", "(?<![A-Za-z])UX(?![A-Za-z])", "交互设计", "视觉设计", "平面设计", "设计师"]}
  - {category: 技术, subcategory: 嵌入式, any: ["嵌入式", "单片机", "MCU", "驱动开发", "固件"]}
  - {category: 技术, subcategory: 前端, any: ["前端", "Web开发", "H5"]}
  - {category: 技术, subcategory: 客户端, any: ["客户端", "iOS", "Android", "安卓", "鸿蒙", "HarmonyOS"]}
  - {category: 技术, subcategory: 测试, any: ["测试工程师", "测试开发", "测试", "软件测试"]}
  - {category: 技术, subcategory: 数据, any: ["数据开发", "数据工程", "大数据", "数仓", "数据仓库", "数据分析", "数据挖掘", "数据科学", "BI工程师"]}
  - {category: 技术, subcategory: 运维, any: ["运维", "(?<![A-Za-z])SRE(?![A-Za-z])", "DevOps", "设施值班", "基础设施值班", "IDC", "机房", "服务器工程师", "值班长"]}
  - {category: 技术, subcategory: 技术支持, any: ["技术支持", "售后工程师", "技术服务", "实施工程师", "现场工程师", "售后技术"]}
  - {category: 技术, subcategory: 安全, any: ["网络安全", "信息安全", "安全工程师", "渗透", "密码"]}
  - {category: 技术, subcategory: 后端, any: ["后端", "后台开发", "服务端", "Java开发", "Java工程师", "Golang", "Go开发", "C\\+\\+开发", "PHP", "Python开发"]}
  - {category: 技术, subcategory: 软件开发, any: ["软件开发", "软件工程师", "系统工程师", "研发技术", "科技岗", "开发工程师", "研发工程师", "程序员", "架构师"]}

  # —— 科研 / 酒店物业 / 地产物业（放在技术与销售之前，避免「值班工程师」「招商经理」被吸走）——
  - {category: 科研, subcategory: 研究, any: ["博士后", "研究助理", "助理研究员", "科研", "课题", "实验员"]}
  - {category: 酒店物业, subcategory: 酒店运营, any: ["前厅", "客房", "礼宾", "行李员", "餐厅服务员", "餐饮服务员", "宴会", "管事", "楼层", "保洁", "PA员", "保安员", "安保员", "厨师", "厨工", "面点", "洗衣", "布草", "会所", "温泉", "救生员"]}
  - {category: 酒店物业, subcategory: 工程技工, any: ["技工", "工程技工", "维修工", "电工", "焊工", "空调工", "水暖工", "管道工", "木工", "泥瓦", "弱电", "强电", "机电工"]}
  - {category: 地产物业, subcategory: 物业管理, any: ["物业管理", "物业管家", "置业顾问", "案场", "楼宇", "招商主管", "招商经理", "招商专员", "招商岗", "地产", "房地产开发"]}

  # —— 医药 ——
  - {category: 医药, subcategory: 医药研发, any: ["制剂", "药物", "药学", "药理", "毒理", "化学合成", "合成研究", "分析方法", "生物药", "CMC", "多肽", "抗体", "细胞治疗", "注册专员"]}
  - {category: 医药, subcategory: 临床医学, any: ["临床医师", "临床护士", "医师", "护士", "临床研究", "CRA", "CRC", "医学经理", "医学联络"]}
  - {category: 医药, subcategory: 学术推广, any: ["学术专员", "学术推广", "医药代表", "医药信息沟通"]}

  # —— 工程制造 ——
  - {category: 工程制造, subcategory: 汽车工程, any: ["底盘", "车身", "内饰", "外饰", "整车", "动力总成", "NVH", "CAE", "车架", "电驱", "三电", "座舱"]}
  - {category: 工程制造, subcategory: 工艺/设备, any: ["工艺工程师", "设备工程师", "工艺技术", "工艺工程", "制程", "工艺整合", "PIE", "TD工程师"]}
  - {category: 工程制造, subcategory: 质量, any: ["质量工程师", "质量员", "体系工程师", "(?<![A-Za-z])QA(?![A-Za-z])", "质检员", "检验员", "品质", "QA工程师", "QC", "PQE", "SQE", "可靠性"]}
  - {category: 工程制造, subcategory: 机械/电气, any: ["机械工程师", "结构工程师", "结构设计", "暖通工程师", "机械设计", "电气", "自动化工程师", "仿真工程师"]}
  - {category: 工程制造, subcategory: 生产, any: ["生产", "装配", "制造工程师", "精益", "IE工程师", "工艺员", "技术员", "操作工", "巡检"]}

  # —— 商业与职能 ——
  - {category: 教育培训, subcategory: 教师, any: ["主讲", "教师", "讲师", "助教", "班主任", "教研", "教练", "辅导老师", "授课", "双语老师", "学科老师"]}
  - {category: 运营, subcategory: 内容, any: ["拍剪", "剪辑", "摄影", "编导", "主播", "新媒体", "内容运营", "短视频", "直播运营"]}
  - {category: 运营, subcategory: 运营, any: ["运营", "营运", "客服"]}
  - {category: 门店零售, subcategory: 门店运营, any: ["调茶师", "门店", "导购", "营业员", "店员", "店长", "店经理", "值班经理", "收银"]}
  - {category: 市场销售, subcategory: 销售, any: ["销售", "客户经理", "商务", "售前", "业务拓展", "渠道经理", "城市经理", "大客户经理", "(?<![A-Za-z])BD(?![A-Za-z])", "大客户"]}
  - {category: 市场销售, subcategory: 市场, any: ["市场", "营销", "品牌", "公关", "推广"]}
  - {category: 职能, subcategory: 人力, any: ["人力资源", "(?<![A-Za-z])HR(?![A-Za-z])", "HRBP", "招聘", "薪酬"]}
  - {category: 职能, subcategory: 财务审计, any: ["财务", "会计", "审计", "税务", "资金"]}
  - {category: 职能, subcategory: 法务, any: ["法务", "律师", "合规"]}
  - {category: 职能, subcategory: 采购供应链, any: ["采购", "供应链", "物流", "计划员", "仓储", "库房", "物控"]}
  - {category: 职能, subcategory: 行政, any: ["行政", "秘书"]}
  - {category: 金融, subcategory: 银行柜员, any: ["综合柜员", "柜员"]}
  - {category: 金融, subcategory: 保险, any: ["理赔", "核保", "查勘", "定损", "农险", "车险", "寿险", "银保", "人伤", "非车险"]}
  - {category: 金融, subcategory: 投研, any: ["行业研究", "证券研究", "投资", "投行", "投研", "分析师", "精算", "风控", "风险管理"]}
