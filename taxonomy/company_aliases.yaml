# 公司简称 → 库中全名。
#
# 用户口语里说「中核」「中船」「国寿」，库里存的是全称；`--company` 只做子串匹配，
# 简称会直接查不到（2026-10-22 评测 neg-05）。这里登记**能确认唯一**的简称；
# 拿不准的（如「中电」同时指中电科芯片、中电科蓝天）不要加——宁可查不到，也不要串到别家。
#
# 值必须是库中公司名的一段子串（`LIKE %值%`），与 targets/top_companies.yaml 的写法保持一致。

aliases:
  中核: 中国核工业集团
  中船: 中国船舶集团
  国寿: 中国人寿
  中交: 中国交建
  中交建: 中国交建
  中兵: 中国兵器工业集团
  银河证券: 中国银河证券
  东方资产: 中国东方资产管理
  电建: 中国电建北京院
